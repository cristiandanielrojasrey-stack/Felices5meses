    <style>
        body {
            background-color: #ffb7e1;
            color: #ff66b2;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 2.2em;
            margin-bottom: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .galeria img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        img {
            max-width: 150%;
            height: auto;
            border-radius: 5px;
            margin-top: 8px;
        }

        .galeria img:hover {
            transform: scale(1.05);
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #ff66b2;
            border: 2px solid #ff66b2;
            padding: 10px 20px;
            border-radius: 15px;
        }

        a:hover {
            background-color: #ff66b2;
            color: white;
        }
    </style>
</head>
